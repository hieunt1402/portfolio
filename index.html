<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nguyễn Trung Hiếu | Automation Engineer</title>
  <meta
    name="description"
    content="Portfolio của Nguyễn Trung Hiếu - Automation Engineer chuyên workflow automation, RPA, API integration và AI-powered operations."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />
  <link rel="icon" type="image/png" href="https://img.icons8.com/flat-round/64/checkmark.png">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="site-header" id="top">
      <div class="container nav-wrap">
        <a href="#top" class="brand" aria-label="Go to top">
          <span class="brand-mark">&lt;/&gt;</span>
          <div class="brand-copy">
            <strong id="brand-name">Hiếu</strong>
            <span id="brand-role">Automation Engineer</span>
          </div>
        </a>

        <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
          <ul id="nav-list"></ul>
        </nav>

        <div class="header-actions">
          <button
            class="lang-toggle"
            id="lang-toggle"
            type="button"
            aria-label="Toggle language"
          >
            EN
          </button>

          <button
            class="menu-toggle"
            id="menu-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="site-nav"
            aria-label="Open menu"
          >
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <!-- Hero -->
      <section class="hero section" id="home">
        <div class="container hero-grid">
          <div class="hero-copy">
            <span class="eyebrow" id="hero-greeting"></span>

            <h1 class="hero-title">
              <span id="hero-name"></span>
              <span class="accent" id="hero-role"></span>
            </h1>

            <p class="hero-description" id="hero-tagline"></p>

            <div class="hero-actions" id="hero-actions"></div>
            <ul class="hero-meta" id="hero-meta"></ul>
          </div>

          <aside class="hero-panel card">
            <div class="hero-panel-inner">
              <p class="panel-label" id="hero-panel-label"></p>
              <div class="hero-stats" id="hero-stats"></div>
            </div>
          </aside>
        </div>
      </section>

      <!-- About -->
      <section class="section" id="about">
        <div class="container section-stack">
          <div class="section-head">
            <span class="section-kicker" id="about-kicker"></span>
            <h2 class="section-title" id="about-title"></h2>
            <p class="section-description" id="about-description"></p>
          </div>

          <div class="about-grid">
            <article class="card prose-card" id="about-content"></article>

            <aside class="card focus-card">
              <h3 id="focus-title"></h3>
              <ul id="focus-list"></ul>
            </aside>
          </div>
        </div>
      </section>

      <!-- Skills -->
      <section class="section section-muted" id="skills">
        <div class="container section-stack">
          <div class="section-head">
            <span class="section-kicker" id="skills-kicker"></span>
            <h2 class="section-title" id="skills-title"></h2>
            <p class="section-description" id="skills-description"></p>
          </div>

          <div class="skills-grid" id="skills-grid"></div>
        </div>
      </section>

      <!-- Projects -->
      <section class="section" id="projects">
        <div class="container section-stack">
          <div class="section-head section-head-split">
            <div>
              <span class="section-kicker" id="projects-kicker"></span>
              <h2 class="section-title" id="projects-title"></h2>
              <p class="section-description" id="projects-description"></p>
            </div>

            <a class="ghost-link" id="projects-ghost-link" href="#contact"></a>
          </div>

          <div class="projects-grid" id="projects-grid"></div>
        </div>
      </section>

      <!-- Contact -->
      <section class="section section-muted" id="contact">
        <div class="container">
          <div class="contact-card card">
            <div class="contact-copy">
              <span class="section-kicker" id="contact-kicker"></span>
              <h2 class="section-title" id="contact-title"></h2>
              <p class="section-description" id="contact-description"></p>
              <div class="contact-actions" id="contact-actions"></div>
            </div>

            <div class="contact-details" id="contact-details"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p id="footer-text"></p>
        <a href="#home" class="back-to-top" id="back-to-top"></a>
      </div>
    </footer>
  </div>

  <!-- Image Modal -->
  <dialog class="image-modal" id="image-modal">
    <button
      class="modal-close"
      id="modal-close"
      type="button"
      aria-label="Close image preview"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>
    <img id="modal-image" alt="Project preview" />
    <p id="modal-caption"></p>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
